name: Check email bridge secrets

on:
  push:
    branches:
      - codex/vercel-email-bridge

jobs:
  presence-check:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM }}
    steps:
      - name: Report secret presence only
        shell: bash
        run: |
          python - <<'PY'
          import os
          for name in ("VERCEL_TOKEN", "RESEND_API_KEY", "AUTH_EMAIL_FROM"):
              print(f"{name}={'present' if os.environ.get(name) else 'missing'}")
          PY
