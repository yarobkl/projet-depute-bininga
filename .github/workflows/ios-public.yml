name: Build public iPhone app
on:
  push:
    branches: [feature/ios-public-swiftui]
    paths: ['ios/Public/**', '.github/workflows/ios-public.yml']
jobs:
  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew list xcodegen >/dev/null || brew install xcodegen
      - working-directory: ios/Public
        run: |
          xcodegen generate
          xcodebuild -project Bininga.xcodeproj -scheme Bininga -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/BiningaDerived" build
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for runtime,devices in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$RUNNER_TEMP/BiningaDerived/Build/Products/Debug-iphonesimulator/Bininga.app"
          xcrun simctl launch "$device" fr.yaroconsulting.bininga.publicapp
          sleep 3
          xcrun simctl io "$device" screenshot "$RUNNER_TEMP/Bininga-home.png"
          xcrun simctl list devices available -j | python3 -c 'import json,sys; rows=[d for k,v in json.load(sys.stdin)["devices"].items() if "iOS" in k for d in v]; names=["iPhone SE (3rd generation)","iPhone 16 Plus","iPhone 16 Pro"]; selected=[next((d for d in rows if d["name"]==n),None) for n in names]; [print(d["udid"]) for d in selected if d]' > "$RUNNER_TEMP/layout-devices.txt"
          while read -r layout_device; do
            xcrun simctl boot "$layout_device" || true
            xcrun simctl bootstatus "$layout_device" -b
            xcrun simctl install "$layout_device" "$RUNNER_TEMP/BiningaDerived/Build/Products/Debug-iphonesimulator/Bininga.app"
            xcrun simctl launch "$layout_device" fr.yaroconsulting.bininga.publicapp
            sleep 3
            xcrun simctl io "$layout_device" screenshot "$RUNNER_TEMP/Bininga-home-$layout_device.png"
          done < "$RUNNER_TEMP/layout-devices.txt"
          xcodebuild -project Bininga.xcodeproj -scheme Bininga -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bininga-iPhone-layout
          path: ${{ runner.temp }}/Bininga-home*.png
          retention-days: 7
