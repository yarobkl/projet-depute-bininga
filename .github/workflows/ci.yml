name: CI — Tests automatiques

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Tests & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer le moteur de tests
        run: python -m pip install "pytest>=8,<9"

      - name: Vérification syntaxe Python
        run: |
          python -m py_compile server.py passenger_wsgi.py vercel_entrypoint.py vercel_public_fastpath.py backup_bininga.py restore_bininga.py backup_download.py content_integrity.py admin_system_authz.py admin_request_pipeline.py admin_auth_flow.py admin_access_model.py admin_bootstrap_transition.py admin_owners.py admin_permissions.py account_incident_response.py db_resilience.py db_health_endpoint.py editorial_publish_integrity.py first_person_content_migration.py email_delivery_diagnostics.py serverless_monitor_restart.py
          echo "✅ Python — syntaxe OK"

      - name: Vérification syntaxe JavaScript
        run: |
          node --check static/index.js
          node --check static/index-core.js
          node --check static/public-experience.js
          node --check static/analytics-consent.js
          node --check static/public-form-hardening.js
          node --check static/admin.js
          node --check static/admin-core.js
          node --check static/admin-session-hardening.js
          node --check static/admin-auth-management.js
          node --check static/admin-collaborator-management.js
          node --check static/admin-advanced-security.js

      - name: Validation data.json
        run: |
          python -c "
          import json, sys
          try:
              with open('data.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
              required = ['hero', 'about', 'stats', 'actus', 'gallery', 'seo']
              missing = [k for k in required if k not in data]
              if missing:
                  print(f'❌ Clés manquantes dans data.json: {missing}')
                  sys.exit(1)
              print('✅ data.json — structure valide')
          except json.JSONDecodeError as e:
              print(f'❌ data.json invalide: {e}')
              sys.exit(1)
          "

      - name: Vérification des fichiers requis
        run: |
          python -c "
          import os, sys
          required = ['index.html', 'admin.html', 'server.py', 'data.json', 'static/admin-production.js', 'static/admin-core.js', 'static/admin-auth-management.js', 'static/admin-collaborator-management.js', 'static/admin-advanced-security.js', 'static/admin-reset-password.html', 'static/admin-first-login.html', 'admin_auth_flow.py', 'admin_access_model.py', 'admin_bootstrap_transition.py', 'admin_owners.py', 'admin_permissions.py', 'account_incident_response.py', 'db_resilience.py', 'restore_bininga.py', 'first_person_content_migration.py', 'email_delivery_diagnostics.py', 'serverless_monitor_restart.py', 'docs/SECURITY_AND_ACCESS_MODEL.md']
          missing = [f for f in required if not os.path.isfile(f)]
          if missing:
              print(f'❌ Fichiers manquants: {missing}')
              sys.exit(1)
          print('✅ Tous les fichiers requis sont présents')
          "

      - name: Contrats actions admin
        run: |
          python tests/test_admin_ui.py
          python tests/test_admin_action_contracts.py
          python tests/test_architecture_contracts.py
          python tests/test_admin_auth_flow.py
          python tests/test_admin_owners.py
          python tests/test_admin_access_model.py
          python tests/test_admin_permissions.py
          python tests/test_architecture_90.py
          python tests/test_db_resilience.py
          python tests/test_incident_response.py
          python tests/test_restore_bininga.py
          python tests/test_editorial_publish_integrity.py
          python tests/test_first_person_content.py
          python tests/test_email_delivery_diagnostics.py
          python tests/test_serverless_monitor_restart.py
          python tests/test_public_experience.py
          python tests/test_analytics_consent.py
          python tests/test_vercel_public_fastpath.py
          python tests/test_backup_download.py
          python tests/test_content_integrity.py

      - name: Tests unitaires chatbot et point d'entrée Vercel
        env:
          BININGA_TEST: "1"
        run: |
          pytest -q \
            tests/test_chat.py \
            tests/test_chatbot_hardening.py \
            tests/test_chatbot_nlu.py \
            tests/test_vercel_chat_entrypoint.py

      - name: Qualité institutionnelle et SEO
        run: python scripts/quality_gate.py

      - name: Tests du serveur HTTP
        env:
          BININGA_PASS: bininga2025
          BININGA_TEST: "1"
        run: |
          BININGA_CI_DATA="$(mktemp -d)"
          DATA_DIR="$BININGA_CI_DATA" python tests/test_server.py

      - name: Parcours end-to-end complet
        run: python tests/test_e2e_complet.py

      - name: Suite de sécurité admin
        env:
          BININGA_FORCE_HTTP: "1"
        run: python test_security.py
