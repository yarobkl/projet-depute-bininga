[project]
name = "projet-depute-bininga"
version = "0.1.0"
description = "Site officiel et plateforme Bininga"
requires-python = ">=3.11"
dependencies = [
  "psycopg2-binary",
  "PyMySQL",
  "requests",
  "beautifulsoup4",
  "googletrans==4.0.0-rc1",
]

[tool.vercel]
entrypoint = "vercel_entrypoint:application"

[tool.vercel.scripts]
build = "python scripts/build_vercel_public.py"
