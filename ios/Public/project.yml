name: Bininga
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  Bininga:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.yaroconsulting.bininga.publicapp
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_CFBundleDisplayName: BININGA
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
  BiningaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Bininga
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fr.yaroconsulting.bininga.publicapp.uitests
schemes:
  Bininga:
    build:
      targets:
        Bininga: all
    test:
      targets:
        - BiningaUITests
