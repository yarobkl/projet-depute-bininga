<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>BININGA — Réinitialiser le mot de passe</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}.box{width:min(100%,440px);background:#111722;border:1px solid #263247;border-radius:18px;padding:34px 28px 30px;box-shadow:0 30px 80px rgba(0,0,0,.45)}.logo{width:62px;height:62px;margin:0 auto 22px;border-radius:14px;background:#bb1232;display:grid;place-items:center;font:700 30px Georgia,serif}.box h1{text-align:center;font-size:22px;margin:0 0 8px}.lead{text-align:center;margin:0 0 24px;color:#8d95a4;font-size:14px;line-height:1.5}.field{display:block;width:100%;height:56px;margin:0 0 14px;padding:0 16px;border:1px solid #344056;border-radius:12px;background:#192231;color:#fff;font-size:16px;outline:none}.field:focus{border-color:#bb1232;box-shadow:0 0 0 3px rgba(187,18,50,.14)}.btn{display:block;width:100%;height:54px;border:0;border-radius:12px;background:#bb1232;color:#fff;font-size:16px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55}.hint{font-size:12px;color:#7f8999;line-height:1.5;margin:0 0 18px}.msg{min-height:22px;margin-top:14px;font-size:13px;line-height:1.5}.msg.error{color:#ff7f8d}.msg.ok{color:#7df0aa}.back{display:block;text-align:center;color:#aeb7c6;font-size:13px;margin-top:20px;text-decoration:none}.back:hover{text-decoration:underline}@media(max-width:520px){body{align-items:flex-start;padding:10vh 18px 32px}.box{padding:30px 22px 26px}}
</style>
</head>
<body>
<main class="box">
  <div class="logo">B</div>
  <h1>Nouveau mot de passe</h1>
  <p class="lead">Définissez un nouveau mot de passe pour votre compte d’administration BININGA.</p>
  <form id="form">
    <input class="field" id="p1" type="password" autocomplete="new-password" placeholder="Nouveau mot de passe" required>
    <input class="field" id="p2" type="password" autocomplete="new-password" placeholder="Confirmer le mot de passe" required>
    <p class="hint">12 caractères minimum, avec au moins trois catégories parmi majuscules, minuscules, chiffres et symboles.</p>
    <button class="btn" id="btn" type="submit">Réinitialiser le mot de passe</button>
    <div class="msg" id="msg" role="alert" aria-live="polite"></div>
  </form>
  <a class="back" href="/static/admin-login-shell.html">← Retour à la connexion</a>
</main>
<script>
(() => {
  'use strict';
  const params=new URLSearchParams(location.search);
  const token=params.get('token')||'';
  const form=document.getElementById('form');
  const p1=document.getElementById('p1');
  const p2=document.getElementById('p2');
  const btn=document.getElementById('btn');
  const msg=document.getElementById('msg');
  const show=(text,ok=false)=>{msg.textContent=text;msg.className='msg '+(ok?'ok':'error');};
  if(!token){show('Ce lien de réinitialisation est invalide ou incomplet.');btn.disabled=true;}
  form.addEventListener('submit',async(e)=>{
    e.preventDefault();
    if(!token)return;
    if(p1.value!==p2.value){show('Les deux mots de passe ne correspondent pas.');return;}
    btn.disabled=true;btn.textContent='Réinitialisation…';show('');
    try{
      const res=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,new_password:p1.value}),cache:'no-store'});
      const data=await res.json();
      if(!data.ok){show(data.message||'Réinitialisation impossible.');return;}
      show(data.message||'Mot de passe modifié.',true);
      form.reset();
      setTimeout(()=>location.replace('/static/admin-login-shell.html?reset=1'),1200);
    }catch(_){show('Service de réinitialisation momentanément indisponible.');}
    finally{btn.disabled=false;btn.textContent='Réinitialiser le mot de passe';}
  });
})();
</script>
</body>
</html>
